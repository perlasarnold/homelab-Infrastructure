services:
  gluetun:
    image: qmcgaw/gluetun
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "9117:9117" # Jackett
      - "9696:9696" # Prowlarr
      - "9091:9091" # Transmission Web UI
      - "51413:51413"
      - "51413:51413/udp"
    environment:
      - VPN_SERVICE_PROVIDER=custom
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=<YOUR_WIREGUARD_PRIVATE_KEY>
      - WIREGUARD_ADDRESSES=10.14.0.2/16
      - WIREGUARD_PUBLIC_KEY=<SURFSHARK_SERVER_PUBLIC_KEY>
      - WIREGUARD_ENDPOINT_IP=198.51.100.10
      - WIREGUARD_ENDPOINT_PORT=51820
      - DOT=off
      - DNS_PLAINTEXT_ADDRESS=1.1.1.1
      - FIREWALL_OUTBOUND_SUBNETS=192.168.1.0/24,192.168.110.0/24,192.168.120.0/24
      - TZ=America/Los_Angeles
    restart: always

  transmission:
    image: lscr.io/linuxserver/transmission:latest
    container_name: transmission
    network_mode: "service:gluetun"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Los_Angeles
    volumes:
      - ./config/transmission:/config
      - /mnt/seagate/Downloads:/downloads
      - ./data/watch:/watch
    depends_on:
      gluetun:
        condition: service_healthy
    restart: unless-stopped

  jackett:
    image: lscr.io/linuxserver/jackett:latest
    container_name: jackett
    network_mode: "service:gluetun"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Los_Angeles
    volumes:
      - ./config/jackett:/config
      - /mnt/ebooks:/ebooks
    depends_on:
      gluetun:
        condition: service_healthy
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    network_mode: "service:gluetun"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Los_Angeles
    volumes:
      - ./config/prowlarr:/config
    depends_on:
      gluetun:
        condition: service_healthy
    restart: unless-stopped

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    network_mode: "service:gluetun"
    environment:
      - LOG_LEVEL=info
      - TZ=America/Los_Angeles
    depends_on:
      gluetun:
        condition: service_healthy
    restart: unless-stopped

  bindery:
    image: ghcr.io/vavallee/bindery:latest
    container_name: readarr
    environment:
      - TZ=America/Los_Angeles
      - BINDERY_LIBRARY_DIR=/books
      - BINDERY_DOWNLOAD_DIR=/downloads
    volumes:
      - ./config/bindery:/config
      - /mnt/ebooks:/books
      - /mnt/seagate/Downloads:/downloads
    ports:
      - "8787:8787"
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Los_Angeles
    volumes:
      - ./config/sonarr:/config
      - /mnt/seagate/TV Shows:/tv
      - /mnt/seagate/Downloads:/downloads
    ports:
      - "8989:8989"
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Los_Angeles
    volumes:
      - ./config/radarr:/config
      - /mnt/seagate/Movies:/movies
      - /mnt/seagate/Downloads:/downloads
    ports:
      - "7878:7878"
    restart: unless-stopped

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Los_Angeles
    volumes:
      - ./config/bazarr:/config
      - /mnt/seagate/TV Shows:/tv
      - /mnt/seagate/Movies:/movies
    ports:
      - "6767:6767"
    restart: unless-stopped

  wizarr:
    image: ghcr.io/wizarrrr/wizarr:latest
    container_name: wizarr
    environment:
      - TZ=America/Los_Angeles
    volumes:
      - ./config/wizarr:/data/database
    ports:
      - "5690:5690"
    restart: unless-stopped
