---
# ansible/playbooks/02_install_docker.yml
# Installs Docker Engine + Docker Compose plugin on the Debian VM.
# Uses the official Docker apt repository (not the distro package).
# Runs after 01_bootstrap.yml.

- name: Install Docker Engine
  hosts: homelab_vms
  become: true
  gather_facts: true

  vars:
    docker_user: "{{ lookup('env', 'HOMELAB_USER') | default('debian', true) }}"

  tasks:
    # ── Remove any legacy Docker packages ─────────────────────────────────────
    - name: Remove old Docker packages if present
      ansible.builtin.apt:
        name:
          - docker
          - docker-engine
          - docker.io
          - containerd
          - runc
        state: absent
      ignore_errors: true

    # ── Add Docker's official GPG key and repo ─────────────────────────────────
    - name: Install apt transport packages
      ansible.builtin.apt:
        name: [ca-certificates, curl, gnupg]
        state: present
        update_cache: true

    - name: Create Docker keyring directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Add Docker GPG key
      ansible.builtin.shell: |
        curl -fsSL https://download.docker.com/linux/debian/gpg | \
          gpg --dearmor -o /etc/apt/keyrings/docker.gpg
        chmod a+r /etc/apt/keyrings/docker.gpg
      args:
        creates: /etc/apt/keyrings/docker.gpg

    - name: Add Docker apt repository
      ansible.builtin.apt_repository:
        repo: >
          deb [arch={{ ansible_architecture | replace('x86_64','amd64') }}
          signed-by=/etc/apt/keyrings/docker.gpg]
          https://download.docker.com/linux/debian
          {{ ansible_distribution_release }} stable
        state: present
        filename: docker

    # ── Install Docker ─────────────────────────────────────────────────────────
    - name: Install Docker Engine and Compose plugin
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Enable and start Docker
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: true

    # ── Add deploy user to docker group ───────────────────────────────────────
    - name: Add user to docker group (no sudo required for docker commands)
      ansible.builtin.user:
        name: "{{ docker_user }}"
        groups: docker
        append: true

    # ── Firewall: allow container-to-host inter-network communication ──────────
    - name: Allow Docker bridge network through UFW
      community.general.ufw:
        rule: allow
        interface: docker0
        direction: in
      ignore_errors: true

    # ── Docker daemon security hardening ───────────────────────────────────────
    - name: Configure Docker daemon with security hardening
      ansible.builtin.copy:
        dest: /etc/docker/daemon.json
        content: |
          {
            "log-driver": "json-file",
            "log-opts": {
              "max-size": "10m",
              "max-file": "3"
            },
            "no-new-privileges": true,
            "userns-remap": "default",
            "icc": false,
            "userland-proxy": false
          }
        mode: '0644'
      notify: Restart Docker

    # ── Verify Docker works ────────────────────────────────────────────────────
    - name: Run Docker hello-world to verify installation
      ansible.builtin.command: docker run --rm hello-world
      become_user: "{{ docker_user }}"
      register: docker_test
      changed_when: false

    - name: Show Docker version
      ansible.builtin.command: docker version --format '{{ "{{" }}.Server.Version{{ "}}" }}'
      register: docker_ver
      changed_when: false

    - name: Print Docker version
      ansible.builtin.debug:
        msg: "Docker {{ docker_ver.stdout }} installed successfully ✓"

  handlers:
    - name: Restart Docker
      ansible.builtin.systemd:
        name: docker
        state: restarted
