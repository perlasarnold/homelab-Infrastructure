# scheduled-maintenance.yml
# Monthly maintenance: system + Docker updates, reboot-if-needed.
# Also available as a manual trigger for on-demand maintenance.

name: "Scheduled Maintenance"

on:
  schedule:
    - cron: "0 3 1 * *"   # 1st of each month at 03:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (check only, no changes)"
        type: boolean
        default: false

jobs:
  maintenance:
    name: "Monthly Maintenance"
    runs-on: [self-hosted, Linux, homelab]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Ansible
        run: which ansible || (sudo apt-get update -qq && sudo apt-get install -y -qq ansible)

      - name: Write SSH key
        run: |
          install -m 600 /dev/null /tmp/homelab_key
          echo "${{ secrets.DEBIAN_SSH_PRIVATE_KEY }}" > /tmp/homelab_key

      - name: Build inventory
        run: |
          cat > /tmp/maint_inventory.yml <<EOF
          all:
            children:
              homelab_vms:
                hosts:
                  debian-server:
                    ansible_host: ${{ secrets.DEBIAN_VM_IP }}
                    ansible_user: ${{ secrets.DEBIAN_VM_USER }}
                    ansible_ssh_private_key_file: /tmp/homelab_key
          EOF

      - name: Run maintenance playbook
        run: |
          EXTRA_ARGS=""
          if [[ "${{ github.event.inputs.dry_run }}" == "true" ]]; then
            EXTRA_ARGS="--check --diff"
          fi
          ansible-playbook \
            -i /tmp/maint_inventory.yml \
            ansible/playbooks/04_maintenance.yml \
            $EXTRA_ARGS
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"

      - name: Clean up
        if: always()
        run: rm -f /tmp/homelab_key /tmp/maint_inventory.yml
