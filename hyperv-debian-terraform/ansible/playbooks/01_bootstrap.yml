---
# ansible/playbooks/01_bootstrap.yml
# First-run configuration of the Debian VM.
# Runs after Terraform creates the VM.
# Hardens SSH, creates non-root user, installs baseline packages, configures UFW.
#
# SECURITY NOTES:
#   - Password SSH login is DISABLED — key-only auth enforced
#   - Root SSH login is DISABLED
#   - SSH key is never stored in this repo (injected by GitHub Actions at runtime)
#   - All secrets (DB passwords etc.) are managed via SOPS-encrypted files or
#     GitHub Secrets — never plaintext in code

- name: Bootstrap Debian VM
  hosts: homelab_vms
  become: true
  gather_facts: true

  vars:
    homelab_user: "{{ lookup('env', 'HOMELAB_USER') | default('debian', true) }}"
    ssh_port: 22    # change to non-standard port in production for obscurity

  tasks:
    # ── System update ──────────────────────────────────────────────────────────
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Upgrade all packages to latest
      ansible.builtin.apt:
        upgrade: dist
        autoremove: true
        autoclean: true

    # ── Essential packages ─────────────────────────────────────────────────────
    - name: Install baseline packages
      ansible.builtin.apt:
        name:
          - curl
          - wget
          - git
          - vim
          - htop
          - jq
          - unzip
          - ca-certificates
          - gnupg
          - lsb-release
          - net-tools
          - ufw
          - fail2ban
          - unattended-upgrades
          - apt-listchanges
          - needrestart
          - logrotate
          - chrony          # NTP time sync
          - qemu-guest-agent  # For Proxmox IP reporting
        state: present

    # ── Time sync ──────────────────────────────────────────────────────────────
    - name: Enable and start chrony
      ansible.builtin.systemd:
        name: chronyd
        state: started
        enabled: true

    # ── QEMU guest agent (Proxmox) ─────────────────────────────────────────────
    - name: Enable QEMU guest agent
      ansible.builtin.systemd:
        name: qemu-guest-agent
        state: started
        enabled: true
      ignore_errors: true   # Not present on Hyper-V — that's fine

    # ── User setup ─────────────────────────────────────────────────────────────
    - name: Ensure homelab user exists
      ansible.builtin.user:
        name: "{{ homelab_user }}"
        groups: sudo
        shell: /bin/bash
        create_home: true
        state: present

    - name: Allow passwordless sudo for homelab user
      ansible.builtin.lineinfile:
        path: /etc/sudoers.d/{{ homelab_user }}
        line: "{{ homelab_user }} ALL=(ALL) NOPASSWD:ALL"
        create: true
        mode: '0440'
        validate: visudo -cf %s

    # ── SSH hardening ──────────────────────────────────────────────────────────
    - name: Harden SSH configuration
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
        backup: true
      loop:
        - { regexp: '^#?PermitRootLogin',          line: 'PermitRootLogin no' }
        - { regexp: '^#?PasswordAuthentication',   line: 'PasswordAuthentication no' }
        - { regexp: '^#?PubkeyAuthentication',     line: 'PubkeyAuthentication yes' }
        - { regexp: '^#?X11Forwarding',            line: 'X11Forwarding no' }
        - { regexp: '^#?MaxAuthTries',             line: 'MaxAuthTries 3' }
        - { regexp: '^#?LoginGraceTime',           line: 'LoginGraceTime 30' }
        - { regexp: '^#?AllowAgentForwarding',     line: 'AllowAgentForwarding no' }
        - { regexp: '^#?ClientAliveInterval',      line: 'ClientAliveInterval 300' }
        - { regexp: '^#?ClientAliveCountMax',      line: 'ClientAliveCountMax 2' }
        - { regexp: '^#?Protocol',                 line: 'Protocol 2' }
      notify: Restart SSH

    # ── Firewall (UFW) ─────────────────────────────────────────────────────────
    - name: Set UFW default policies
      community.general.ufw:
        direction: "{{ item.direction }}"
        policy: "{{ item.policy }}"
      loop:
        - { direction: incoming, policy: deny }
        - { direction: outgoing, policy: allow }

    - name: Allow SSH through UFW
      community.general.ufw:
        rule: allow
        port: "{{ ssh_port }}"
        proto: tcp

    - name: Enable UFW
      community.general.ufw:
        state: enabled

    # ── fail2ban ───────────────────────────────────────────────────────────────
    - name: Configure fail2ban for SSH
      ansible.builtin.copy:
        dest: /etc/fail2ban/jail.local
        content: |
          [DEFAULT]
          bantime  = 3600
          findtime = 600
          maxretry = 5

          [sshd]
          enabled  = true
          port     = ssh
          logpath  = /var/log/auth.log
          maxretry = 3
          bantime  = 86400
        mode: '0644'
      notify: Restart fail2ban

    # ── Automatic security updates ─────────────────────────────────────────────
    - name: Configure unattended-upgrades (security patches only)
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/50unattended-upgrades
        content: |
          Unattended-Upgrade::Allowed-Origins {
            "${distro_id}:${distro_codename}-security";
          };
          Unattended-Upgrade::AutoFixInterruptedDpkg "true";
          Unattended-Upgrade::MinimalSteps "true";
          Unattended-Upgrade::Remove-Unused-Dependencies "true";
          Unattended-Upgrade::Automatic-Reboot "false";  // managed by maintenance cron
          Unattended-Upgrade::Mail "";
        mode: '0644'

    - name: Enable unattended-upgrades auto-apply
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";
          APT::Periodic::AutocleanInterval "7";
        mode: '0644'

  handlers:
    - name: Restart SSH
      ansible.builtin.systemd:
        name: sshd
        state: restarted

    - name: Restart fail2ban
      ansible.builtin.systemd:
        name: fail2ban
        state: restarted
        enabled: true
