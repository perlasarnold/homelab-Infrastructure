# ─── Nextcloud + MariaDB ──────────────────────────────────────────────────────
# Self-hosted Google Drive/Photos alternative.
# Access: http://<VM-IP>:8081 (first run creates admin account)
# r/homelab rating: ★★★★☆  most popular self-hosted cloud storage
#
# ⚠️  Change MYSQL_PASSWORD and NEXTCLOUD_ADMIN_PASSWORD before deploying.
# ⚠️  Set NEXTCLOUD_TRUSTED_DOMAINS to your VM IP or domain.

name: nextcloud

services:
  db:
    image: mariadb:11
    container_name: nextcloud-db
    restart: unless-stopped
    command: --transaction-isolation=READ-COMMITTED --log-bin=binlog --binlog-format=ROW
    volumes:
      - nextcloud_db:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: "rootpassword_change_me"
      MYSQL_PASSWORD:      "nextcloud_change_me"
      MYSQL_DATABASE:      nextcloud
      MYSQL_USER:          nextcloud

  redis:
    image: redis:alpine
    container_name: nextcloud-redis
    restart: unless-stopped

  nextcloud:
    image: nextcloud:stable
    container_name: nextcloud
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      - db
      - redis
    volumes:
      - nextcloud_html:/var/www/html
      - /data/nextcloud:/var/www/html/data   # ← user data dir in VM
    environment:
      MYSQL_HOST:                "db"
      MYSQL_PASSWORD:            "nextcloud_change_me"   # match db above
      MYSQL_DATABASE:            nextcloud
      MYSQL_USER:                nextcloud
      REDIS_HOST:                redis
      NEXTCLOUD_ADMIN_USER:      admin
      NEXTCLOUD_ADMIN_PASSWORD:  "admin_change_me"
      NEXTCLOUD_TRUSTED_DOMAINS: "localhost 192.168.1.0/24"   # ← add your domain/IP

volumes:
  nextcloud_db:
  nextcloud_html:
